openapi: 3.0.3
info:
  title: Postal Delivery Operations & Optimization System API
  version: 0.2.0
  description: >
    Admin API for postal delivery operations across multiple post offices,
    beats, postmen and deliveries. See /api/v1/* routers in source for the
    authoritative, up-to-date contract; this document covers the primary
    resources.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /auth/login:
    post:
      summary: Authenticate and receive access/refresh tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "200": { description: OK }
        "401": { description: Invalid credentials }
  /dashboard/summary:
    get:
      summary: Aggregate dashboard cards, workload and recent activity
      responses:
        "200": { description: OK }
  /deliveries:
    get:
      summary: Search deliveries with filters and pagination
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
      responses:
        "200": { description: OK }
  /imports/upload:
    post:
      summary: Upload a CSV/XLSX/PDF delivery file and receive an import preview
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "201": { description: Import created with preview }
  /imports/{id}/confirm:
    post:
      summary: Confirm a previewed import and write deliveries to the database
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Import confirmed }
  /beats:
    get:
      summary: List beats (with GeoJSON boundary) scoped to the caller's post office
      responses:
        "200": { description: OK }
  /maps/deliveries:
    get:
      summary: GeoJSON FeatureCollection of delivery points for the map
      responses:
        "200": { description: OK }
  /auth/change-password:
    post:
      summary: Choose a new password (required while the account has a temporary one)
      description: >
        Checks the current password and the password rules (10+ characters, a letter and a number, not the email name, not
        a well-known password), ends every other session and returns new, unrestricted tokens. While
        `mustChangePassword` is true every other endpoint answers 403 with `details.code = PASSWORD_CHANGE_REQUIRED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string }
      responses:
        "200": { description: New accessToken and refreshToken }
        "400": { description: The new password breaks the rules (message says which) }
        "401": { description: The current password is not correct }
  /assignments/exceptions:
    get:
      summary: Open assignment exceptions with the suggested beat, confidence, reason and location quality
  /assignments/exceptions/{id}/resolve:
    post:
      summary: Assign a beat (and its postman) to the delivery of an exception; recorded as a MANUAL assignment
  /beats/territory-report:
    get:
      summary: Verified / needs-verification / missing / overlapping territories of the office, and each overlapping pair
  /beats/{id}/verify:
    post:
      summary: Verify a beat's territory (409 with requiresAcknowledgement when it overlaps another beat, unless acknowledgeOverlap is sent)
  /beats/import:
    post:
      summary: Upload a beat list (CSV / XLSX, one row per beat or per beat and locality); nothing is imported until confirmed
  /deliveries/{id}/proof:
    post:
      summary: Add the proof-of-delivery photo (multipart field `photo`; only while OUT_FOR_DELIVERY; only the delivery's postman or the office's administrators)
    get:
      summary: Read the proof photo (private, never cached; the delivery's postman and the office's administrators only)
  /deliveries/{id}/status:
    post:
      summary: Change the status through the state machine; DELIVERED is refused without a proof photo when the post office requires one
  /post-offices/{id}/proof-mode:
    put:
      summary: What the post office requires as proof of delivery (NONE or PHOTO)
  /me/push-token:
    post:
      summary: Register this phone's Expo push token for the signed-in postman
    delete:
      summary: Stop pushes to this phone
  /postmen/{id}/message:
    post:
      summary: Send a message to a postman (stored in their Notifications and pushed to their phone)
